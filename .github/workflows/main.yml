name: exams_automation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بضغطة زر من صفحة Actions دون الحاجة لعمل push

jobs:
  # ==========================================
  # 1. مهمة بناء أندرويد (Android Job)
  # ==========================================
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 21 (المتوافقة مع Gradle 8.14 و AGP 8.9)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. جلب المكتبات وتحديث الكاش
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء تطبيق APK عبر محرك Flutter القياسي
      - name: Build APK via Flutter
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 6. فحص شامل واستخراج ملف الـ APK
      - name: Locate and Prepare APK
        run: |
          mkdir -p build/app/outputs/flutter-apk
          echo "=== فحص ملفات APK المنتجة في كامل المشروع ==="
          find . -name "*.apk" || true

          # البحث عن ملف الـ APK النهائي
          APK_FILE=$(find build/ android/app/build/ -type f -name "*.apk" 2>/dev/null | grep -E "app-release|app-debug" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            # إذا لم يُعثر عليه بالاسم القياسي، يتم أخذ أول ملف APK خارج مجلدات intermediates
            APK_FILE=$(find . -type f -name "*.apk" ! -path "*/intermediates/*" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "❌ لم يتم العثور على أي ملف APK، جاري فحص ملفات AAB..."
            find . -name "*.aab" || true
            exit 1
          fi

          echo "✅ تم العثور على الـ APK في: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk

      # 7. رفع ملف الـ APK لتنزيله من Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ==========================================
  # 2. مهمة بناء آيفون (iOS Job)
  # ==========================================
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. جلب الكود من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. جلب المكتبات وتجهيز محرك iOS
      - name: Install Dependencies & Precache iOS
        run: |
          flutter pub get
          flutter precache --ios

      # 4. تثبيت CocoaPods وتجهيز ملفات Xcode
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # 5. بناء التطبيق عبر xcodebuild مباشرة وتجاوز فحص الشهادات
      - name: Build iOS via Xcode
        run: |
          cd ios
          xcodebuild clean build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -destination "generic/platform=iOS"
          cd ..

      # 6. تجميع حزمة IPA
      - name: Create IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          find ios/build -name "Runner.app" -exec cp -r {} build/ios/iphoneos/Payload/ \; 2>/dev/null || \
          find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -exec cp -r {} build/ios/iphoneos/Payload/ \;
          cd build/ios/iphoneos
          zip -r exams_automation.ipa Payload

      # 7. رفع ملف حزمة الـ iOS كـ Artifact
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: build/ios/iphoneos/exams_automation.ipa
