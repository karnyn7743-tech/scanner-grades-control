
name: Extract Flutter ZIP Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP into Repository Root
        run: |
          ZIP_FILE="flutter_project.zip"
          TEMP_DIR="/tmp/flutter_project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p "$TEMP_DIR"

          unzip -q "$ZIP_FILE" -d "$TEMP_DIR"

          COUNT=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)

          SOURCE_DIR="$TEMP_DIR"

          if [ "$COUNT" -eq 1 ]; then
            FIRST=$(find "$TEMP_DIR" -mindepth 1 -maxdepth 1)

            if [ -d "$FIRST" ]; then
              SOURCE_DIR="$FIRST"
            fi
          fi

          echo "Copying Flutter project files..."

          rsync -a \
            --exclude='.github/workflows/' \
            "$SOURCE_DIR"/ .

          echo "Removing ZIP file..."

          rm -f "$ZIP_FILE"

          echo "Project extraction completed."

      - name: Commit Extracted Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract complete Flutter project"
          else
            echo "No changes to commit."
          fi

      - name: Sync and Push to GitHub
        run: |
          git fetch origin main

          git rebase origin/main

          git push origin HEAD:main

          echo "Project successfully uploaded to GitHub!"
