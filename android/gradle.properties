# إعدادات الذاكرة لمحرك Gradle و Kotlin Daemon لمنع توقف المعالج أثناء بناء ML Kit
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2048m

# تسريع عمليات البناء وتفعيل الكاش
org.gradle.parallel=true
org.gradle.caching=true

# دعم AndroidX و Jetifier
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# معالجة مكتبات ML Kit و TFLite
android.disableMinifyLocalDependenciesForLibraries=true
android.experimental.r8.dex-shrunk-desugared-library=true
# التوافق مع AGP 9 مع الاحتفاظ بإضافة Kotlin القديمة
android.builtInKotlin=false

# التوافق مع واجهة Gradle القديمة المستخدمة في المشروع
android.newDsl=false
org.gradle.vfs.watch=false
